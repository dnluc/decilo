name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Detectar backend
        id: backend
        run: |
          if [ -d src ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Backend pendiente: no existe src/. No se ejecutaron compilación, lint ni tests." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.backend.outputs.present == 'true'
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        if: steps.backend.outputs.present == 'true'
        run: |
          python -m pip install ruff==0.13.2 pytest==8.4.2 pytest-asyncio==1.2.0
          if [ -f pyproject.toml ]; then
            python -m pip install -e .
          elif [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            echo "::error::El backend necesita pyproject.toml o requirements.txt."
            exit 1
          fi
          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          fi
          python -m pip check

      - name: Compilar y revisar errores básicos
        if: steps.backend.outputs.present == 'true'
        run: |
          python -m compileall -q src tests
          python -m ruff check --select E9,F63,F7,F82 src tests

      - name: Tests unitarios y regresiones sin modelos
        if: steps.backend.outputs.present == 'true'
        run: |
          python -m pytest tests -q -m "not model" -o "markers=model: requiere modelos o servicios reales"
