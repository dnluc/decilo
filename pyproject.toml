[project]
name = "decilo"
version = "0.1.0"
description = "Transcripcion y traduccion en vivo para conferencias"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decilo"]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.13",
]
